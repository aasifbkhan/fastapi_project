services:
  postgres-test:
    image: postgres:18
    container_name: devflow-postgres-test
    environment:
      POSTGRES_DB: devflow_test
      POSTGRES_USER: devflow_test
      POSTGRES_PASSWORD: devflow_test
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow_test -d devflow_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: